services:
  postgres:
    image: postgres:16
    container_name: clinical-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinical_data
      POSTGRES_USER: clinical_user
      POSTGRES_PASSWORD: clinical_pass
    ports:
      - "5432:5432"
    volumes:
      - ../data-dev/postgres:/var/lib/postgresql/data

